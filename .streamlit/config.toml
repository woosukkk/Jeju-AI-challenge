[server]
address = "127.0.0.1"
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"

# 범정부 UI/UX 디자인 시스템(KRDS, https://www.krds.go.kr) 표준형 색상·글꼴을 따른다.
# 글꼴 Pretendard GOV는 SIL OFL 1.1. 인터넷이 없으면 시스템 글꼴로 대체된다.
[theme]
base = "light"
primaryColor = "#256ef4"             # primary-50
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f6" # gray-5
textColor = "#1e2124"                # gray-90
borderColor = "#cdd1d5"              # gray-20
linkColor = "#0b50d0"                # primary-60
blueColor = "#0b78cb"                # information-50
greenColor = "#228738"               # success-50
yellowColor = "#9e6a00"              # warning-50
redColor = "#de3412"                 # danger-50
font = "Pretendard GOV Variable:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css, Malgun Gothic, sans-serif"
baseFontSize = 17
baseRadius = "6px"
buttonRadius = "6px"
headingFontWeights = [700, 700, 700, 600, 600, 600]
showWidgetBorder = true
